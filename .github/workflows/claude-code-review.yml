# Claude Code 自動コードレビュー（フェーズ④）
#
# Claude Code が PR の差分をレビューしコメントを投稿する品質ゲート。
# 公式 GA アクション anthropics/claude-code-action@v1 を code-review プラグインで利用する。
#
# 【手動（オンデマンド）起動】PR に `review` ラベルを付けたときだけ走る。
#   - 普段の PR 作成・push では走らない（Pro サブスク枠の消費を絞るため）。
#   - レビューしたい PR に `review` ラベルを付与 → 起動。
#   - 再レビューしたいときは、ラベルを一度外して付け直す（labeled イベントが再発火する）。
#
# 前提（リポジトリ admin による事前作業。未整備だとジョブは失敗する）:
#   1. Claude GitHub App をインストール: https://github.com/apps/claude
#   2. Repository secret `CLAUDE_CODE_OAUTH_TOKEN` を追加
#      (Settings -> Secrets and variables -> Actions)
#      トークンは `claude setup-token` で発行。Claude サブスク（Pro/Max）枠で動くため
#      従量課金の API キー（ANTHROPIC_API_KEY）は不要。
#   3. `review` ラベルを作成しておく（起動キー）。
#
# レビュー観点・命名規則・GitHub フローはリポジトリ直下の CLAUDE.md を自動参照する。
# デプロイ用ワークフロー（フェーズ⑤・マージ後 main で起動）は別ファイルで共存させる。

name: Claude Code Review

on:
  pull_request:
    types: [labeled]

# 同一 PR で連続してラベルを付け直したとき、古い実行をキャンセルしてコストと時間を抑える。
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write # anthropics/claude-code-action が OIDC トークン取得に必要

jobs:
  review:
    # `review` ラベルが付いたときだけ実行する（他のラベル付与では走らない）。
    if: github.event.label.name == 'review'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Claude Code review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # レビュー用途は Sonnet で十分・コストを抑える。
          # 大型/重要な変更で深いレビューが要るときは --model claude-opus-4-8 に上げる。
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 15
            --append-system-prompt "レビューの指摘コメントは日本語で書いてください。CLAUDE.md の命名規則・GitHub ワークフロー・サーバー起動ルールに反する変更があれば指摘してください。"
