spring:
  application:
    name: raisechat-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/raisechat
    username: ${DB_USERNAME:raisechat}
    password: ${DB_PASSWORD:raisechat_dev}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
    # dev プロファイルでのみ適用される R__seed_dev.sql が、他プロファイル起動時に
    # 「履歴にあるのにファイルが見つからない」検証エラーで落ちないようにする。
    # 影響範囲を Repeatable migration に限定し、V__ には適用しない。
    ignore-migration-patterns: "repeatable:missing"

server:
  port: 8080

logging:
  level:
    org.flywaydb: INFO
