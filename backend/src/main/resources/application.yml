spring:
  application:
    name: raisechat-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/raisechat
    username: ${DB_USERNAME:raisechat}
    password: ${DB_PASSWORD:raisechat_dev}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
    # dev プロファイルでのみ適用される R__seed_dev.sql が、他プロファイル起動時に
    # 「履歴にあるのにファイルが見つからない」検証エラーで落ちないようにする。
    # 影響範囲を Repeatable migration に限定し、V__ には適用しない。
    ignore-migration-patterns: "repeatable:missing"
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      # アバター 2MB / 添付 10MB の上限はいずれもサービス層で厳密判定し 413 を返す。
      # ここはフレームワーク側の保険として一回り余裕を持たせ、極端に巨大なアップロードのみ弾く。
      max-file-size: 12MB
      max-request-size: 12MB

server:
  port: 8080

jwt:
  # 本番は環境変数 JWT_SECRET で上書きすること。dev デフォルトは HS256 用に 32 バイト以上を確保。
  secret: ${JWT_SECRET:dev-secret-change-me-this-is-at-least-32-bytes-long}
  access-ttl-seconds: 900       # 15 分
  refresh-ttl-seconds: 604800   # 7 日

app:
  ws:
    allowed-origins: ${WS_ALLOWED_ORIGINS:http://localhost:3000}
  redis:
    channel-prefix: "messages:channel:"
    dm-prefix: "messages:dm:"
    thread-prefix: "messages:thread:"
    notification-prefix: "notifications:"
  invite:
    # 招待リンクのベース URL。発行レスポンスの inviteUrl を「base-url/{token}」で組み立てる。
    base-url: ${INVITE_BASE_URL:http://localhost:3000/invite}
  storage:
    # アバター画像などのオブジェクトストレージ設定。dev は LocalStack（S3 エミュレータ）。
    # 本番は実 AWS S3 を指すよう環境変数で上書きする。
    s3:
      bucket: ${S3_BUCKET:raisechat-avatars}
      region: ${AWS_REGION:us-east-1}
      endpoint: ${S3_ENDPOINT:http://localhost:4566}
      access-key: ${AWS_ACCESS_KEY_ID:test}
      secret-key: ${AWS_SECRET_ACCESS_KEY:test}
      # avatarUrl 組み立て用の公開ベース URL（未指定なら endpoint/bucket から導出）。
      public-base-url: ${S3_PUBLIC_BASE_URL:}

logging:
  level:
    org.flywaydb: INFO
